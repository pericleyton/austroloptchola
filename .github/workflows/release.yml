name: build-and-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version string (e.g. 1.2.3). If set, a GitHub Release 'v<version>' will be created and the package will be built with that version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "2.2.207"

      - name: Restore
        run: dotnet restore ./src/Eduq.Helpers/Eduq.Helpers.csproj

      - name: Build (netcoreapp2.2)
        run: dotnet build ./src/Eduq.Helpers/Eduq.Helpers.csproj -c Release -f netcoreapp2.2 --no-restore

      - name: Pack
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack ./src/Eduq.Helpers/Eduq.Helpers.csproj -c Release -o ./artifacts /p:PackageVersion=${{ inputs.version }} -p:ProduceReferenceAssembly=true -p:IncludeRefAssemblies=true
          else
            dotnet pack ./src/Eduq.Helpers/Eduq.Helpers.csproj -c Release -o ./artifacts -p:ProduceReferenceAssembly=true -p:IncludeRefAssemblies=true
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: |
            artifacts/*.nupkg
          generate_release_notes: true
